############################
# microtonOS configuration #
############################

# This file contains general microtonOS configurations.
# For configurations specific to tunings and layouts, see mtsesp_master.toml.
# For configurations concerning the midi implementation, see control_change.toml.

"pw-jack" = {path = "/usr/bin/pw-jack"}
"node.js" = {path = "/home/pi/.nvm/versions/node/v22.14.0/bin/node"}
"Open Stage Control" = {path = "/home/pi/microtonOS/third_party/open-stage-control_1.29.2_node/", config="/home/pi/microtonOS/config/open-stage-control.json", port=8080, ssl=false}
SonoBus = {path = "/usr/bin/sonobus", headless = true}
"Reface CP" = {channel = 0}
"Minilogue XD" = {channel = 0}

###############
# Instruments #
###############

# Ordered according to engine, bank, and program.
# Each engine corresponds to one software instrument.
# The distinction between banks and programs is software-dependent
# and to some extent arbitrary.
# For the moment, only Pianoteq is supported.

[[engine]]
name = "Pianoteq"
headless = false
path = "/usr/bin/Pianoteq 8 STAGE"
preset = "/home/pi/microtonOS/config/Pianoteq/My Presets/NY Steinway D.fxp" # the name of the preset to load on startup or the path if fxp file
midimapping = "midimapping" # the name of the midimapping to use, add the .ptm file under files
files = ["/home/pi/microtonOS/config/Pianoteq/midimapping.ptm"] # files to load
directories = ["/home/pi/microtonOS/config/Pianoteq/My Presets/"] # directories where all .fxp, .mfxp, .ptm, .scl, and .kbm files are loaded
[[engine.bank]]
name = "acoustic"
program = [
    "NY Steinway D",
    "HB Steinway D",
    "J Schantz", "JE Schmidt",
    "A Walter", "D Schöffstoss",
    "C Graf", "Érard",
    "Pleyel"]
[[engine.bank]]
name = "electric"
program = [
    "Rhodes MKI",
    "Rhodes MKII",
    "Wurlitzer 200",
    "Wurlitzer 100",
    "Yamaha CP-80"]
[[engine.bank]]
name = "historical"
program = [
    "cimbalom",
    "Neupert clavichord",
    "FE Blanchet harpsichord",
    "C Grimaldi harpsichord"]
[[engine.bank]]
name = "Bells"
program = [
    "church bells",
    "tubular bells"]

#################
# Color Palette #
#################

# Defines the color palette in use.
# Colors are defined through rgb.
# Values should be floats between 0.0 and 1.0.
# They need not correspond to their labels

[palette]
black = [0.0, 0.0, 0.0]
white = [1.0, 1.0, 1.0]
red = [1.0, 0.0, 0.0]
orange = [1.0 ,0.5, 0.0]
yellow = [1.0, 1.0, 0.0]
green = [0.0, 1.0, 0.0]
cyan = [0.0, 1.0, 1.0]
blue = [0.0, 0.0, 1.0]
magenta = [1.0, 0.0, 1.0]