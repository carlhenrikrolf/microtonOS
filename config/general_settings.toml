####################
# General Settings #
####################

[palette] # rgb values between 0 and 1
black = [0.0, 0.0, 0.0]
white = [1.0, 1.0, 1.0]
red = [1.0, 0.0, 0.0]
orange = [1.0 ,0.5, 0.0]
yellow = [1.0, 1.0, 0.0]
green = [0.0, 1.0, 0.0]
cyan = [0.0, 1.0, 1.0]
blue = [0.0, 0.0, 1.0]
magenta = [1.0, 0.0, 1.0]

[QjackCtl]
patchbay = "/home/pi/microtonOS/config/qjackctl.xml"

[Carla]
headless = false
project = "/home/pi/microtonOS/config/carla.carxp"

[Pianoteq]
path = "/usr/bin/Pianoteq 8 STAGE"
standalone = false
headless = false
midimapping = "midimapping"
preset0 = "/home/pi/microtonOS/config/Pianoteq/Presets/My Presets/NY Steinway D.fxp"
files = []
directories = []

[tuneBfree]
path = "/home/pi/microtonOS/third_party/tuneBfree/build/tuneBfree"
standalone = true
midimapping = "/home/pi/microtonOS/config/tuneBfree/midimapping.toml"
banks = [
    "/home/pi/microtonOS/config/tuneBfree/tonewheel.cfg",
    "/home/pi/microtonOS/config/tuneBfree/sawtooth.cfg",
    "/home/pi/microtonOS/config/tuneBfree/square.cfg",
]
presets = "/home/pi/microtonOS/config/tuneBfree/drawbars.pgm"
audio_output = "Built-in Audio Stereo"

["Surge XT"]
standalone = false

[dexed]
standalone = false

# [DecentSampler]
# path = "/usr/bin/DecentSampler"
# standalone = false
# drumkit = "/home/pi/microtonOS/config/DecentSampler/drumkit"
# #drumkit = "/home/pi/.config/DecentSampler/Sample Libraries/Drum Kits/Acoustic.dsbundle"

["Reface CP"]
channel = 0

["Minilogue XD"]
channel = 0
