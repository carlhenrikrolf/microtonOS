####################
# General Settings #
####################

# Defines the color palette in use.
# Colors are defined through rgb.
# Values should be floats between 0.0 and 1.0.
# They need not correspond to their labels

[palette]
black = [0.0, 0.0, 0.0]
white = [1.0, 1.0, 1.0]
red = [1.0, 0.0, 0.0]
orange = [1.0 ,0.5, 0.0]
yellow = [1.0, 1.0, 0.0]
green = [0.0, 1.0, 0.0]
cyan = [0.0, 1.0, 1.0]
blue = [0.0, 0.0, 1.0]
magenta = [1.0, 0.0, 1.0]